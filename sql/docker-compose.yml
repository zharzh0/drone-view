services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: drone
      MYSQL_USER: drone
      MYSQL_PASSWORD: drone
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  adminer:
    image: adminer
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mysql_data: